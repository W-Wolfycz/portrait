<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>群像 · 概览</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>群像</h1>
        <span class="brand-sub">画像中枢</span>
      </div>
      <nav class="viewnav" role="tablist">
        <button id="nav-dashboard" class="navitem active" type="button" role="tab">
          概览
        </button>
        <button id="nav-profiles" class="navitem" type="button" role="tab">
          画像
        </button>
      </nav>
      <div class="statusbar">
        <span id="status" class="status-chip">加载中…</span>
        <span id="stats" class="stats"></span>
        <button id="refresh" class="button" type="button">刷新</button>
      </div>
    </header>

    <main id="view-dashboard" class="view dashboard">
      <div id="dashboard-body" class="dashboard-body">
        <p class="empty">加载中…</p>
      </div>
    </main>

    <div id="view-profiles" class="view layout" hidden>
      <aside class="sidebar">
        <div class="sidebar-head">
          <div>
            <strong>会话</strong>
            <span id="session-count" class="muted"></span>
          </div>
          <span class="muted">按最近更新</span>
        </div>
        <input id="search" class="search" type="search" placeholder="搜索群号 / 私聊号 / 平台" />
        <div id="sessions" class="session-list"></div>
      </aside>

      <main id="detail" class="detail">
        <div class="placeholder">
          <strong>选择左侧会话</strong>
          <span>查看群画像与人物画像。</span>
        </div>
      </main>
    </div>

    <div id="drawer" class="drawer" hidden>
      <div class="drawer-backdrop" data-close="drawer"></div>
      <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="drawer-head">
          <div>
            <div id="drawer-title" class="drawer-title">人物画像</div>
            <div id="drawer-sub" class="muted"></div>
          </div>
          <div class="drawer-actions">
            <button id="drawer-versions" class="button" type="button">版本</button>
            <button id="drawer-delete" class="button danger" type="button">删除</button>
            <button id="drawer-edit" class="button primary" type="button">编辑</button>
            <button id="drawer-close" class="icon-button" type="button" aria-label="关闭">×</button>
          </div>
        </div>
        <div id="drawer-body" class="drawer-body"></div>
      </aside>
    </div>

    <div id="editor" class="modal" hidden>
      <div class="modal-backdrop" data-close="editor"></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <header class="modal-head">
          <div>
            <h2 id="editor-title">编辑画像</h2>
            <p id="editor-sub" class="muted"></p>
          </div>
          <button id="editor-close" class="icon-button" type="button" aria-label="关闭">×</button>
        </header>
        <div id="editor-form" class="editor-form"></div>
        <footer class="modal-foot">
          <span id="editor-hint" class="muted">字段名使用 snake_case；空行不会保存。</span>
          <div class="modal-actions">
            <button id="editor-cancel" class="button" type="button">取消</button>
            <button id="editor-save" class="button primary" type="button">保存</button>
          </div>
        </footer>
      </section>
    </div>

    <div id="versions" class="modal" hidden>
      <div class="modal-backdrop" data-close="versions"></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="versions-title">
        <header class="modal-head">
          <div>
            <h2 id="versions-title">版本历史</h2>
            <p id="versions-sub" class="muted"></p>
          </div>
          <button id="versions-close" class="icon-button" type="button" aria-label="关闭">×</button>
        </header>
        <div id="versions-body" class="editor-form"></div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
